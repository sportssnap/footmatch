    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 10px;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* Scroll Notice */
        .scroll-notice {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            background-color: #FF0000;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
            animation: fadeInUp 0.5s ease-out forwards, bounce 1.2s infinite alternate;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 0.9; transform: translateY(0); }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(8px); }
        }

        /* League Header Box */
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
            border: 2px solid #e30613;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            margin: 18px 0 12px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .box img {
            width: 38px;
            height: 38px;
            margin-right: 10px;
        }

        /* Match Card */
        .notice {
            display: flex;
            align-items: center;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 10px 12px;
            margin: 10px 0;
            transition: all 0.3s ease;
            text-decoration: none;
            color: black;
        }

        .notice:hover {
            background-color: #f8f8f8;
            border-color: #e30613;
            transform: translateY(-2px);
        }

        .notice b {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .notice img {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }

        .match-info {
            font-size: 14px;
            font-weight: 600;
        }

        .timer {
            margin-left: auto;
            padding: 6px 12px;
            font-weight: bold;
            font-size: 13px;
            color: #333;
            background-color: #f0f0f0;
            border-radius: 6px;
            min-width: 110px;
            text-align: center;
        }

        .blinking {
            animation: blinkingText 1s infinite;
            color: #e30613;
            background-color: #ffebee;
        }

        @keyframes blinkingText {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

    <script>
        function updateMatchStatus() {
            const notices = document.querySelectorAll('.notice');
            const now = new Date();

            notices.forEach(notice => {
                const startTime = new Date(notice.getAttribute('data-start'));
                const endTime = new Date(notice.getAttribute('data-end'));
                const timerElem = notice.querySelector('.timer');

                if (!timerElem) return;

                if (now < startTime) {
                    timerElem.innerText = formatTimeDifference(startTime - now);
                    timerElem.classList.remove('blinking');
                } else if (now >= startTime && now <= endTime) {
                    timerElem.innerText = '🔴 LIVE NOW';
                    timerElem.classList.add('blinking');
                } else {
                    timerElem.innerText = 'Match Ended';
                    timerElem.classList.remove('blinking');
                }
            });
        }

        function formatTimeDifference(milliseconds) {
            const totalSeconds = Math.floor(milliseconds / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            return `${hours}h ${minutes}m ${seconds}s`;
        }

        // Update every second
        setInterval(updateMatchStatus, 1000);
        
        // Initial call
        document.addEventListener('DOMContentLoaded', updateMatchStatus);
    </script>
