<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Matches - Sports Snap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            padding: 10px;
            background-color: #f5f5f5;
        }

        /* Scroll notice */
        .scroll-notice {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            padding: 8px;
            background-color: #FF0000;
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            opacity: 0.9;
            margin-bottom: 10px;
            animation: fadeInUp 0.5s ease-out forwards, bounce 1s infinite alternate;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 0.9; transform: translateY(0); }
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to   { transform: translateY(8px); }
        }

        /* League section header box */
        .box {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid red;
            padding: 4px 10px;
            width: 100%;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            background-color: #f9f9f9;
            margin: 14px 0 4px;
            gap: 8px;
        }
        .box img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .box span { color: #000; letter-spacing: .4px; }

        /* Match row */
        .notice {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 10px;
            border: 2px solid #ddd;
            color: black;
            height: 54px;
            justify-content: flex-start;
            margin: 6px 0;
            overflow: hidden;
            padding: 0 10px;
            font-size: 12px;
            text-decoration: none;
            transition: background-color 0.25s ease;
            position: relative;
        }
        .notice:hover { background-color: #f0f0f0; }

        .notice-inner {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 6px;
            overflow: hidden;
        }
        .notice-inner img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .match-label {
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .format-badge {
            font-size: 10px;
            font-weight: bold;
            background: #3749b4;
            color: #fff;
            border-radius: 4px;
            padding: 1px 6px;
            flex-shrink: 0;
        }

        /* Timer */
        .timer {
            margin-left: auto;
            padding-left: 10px;
            font-weight: bold;
            color: #333;
            font-size: 11px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .blinking {
            animation: blinkingText 1s infinite;
            color: red;
        }
        @keyframes blinkingText {
            0%   { opacity: 1; }
            50%  { opacity: 0; }
            100% { opacity: 1; }
        }
        .ended-text { color: #888; }

        /* Section heading */
        .section-heading {
            font-size: 13px;
            font-weight: bold;
            color: #3749b4;
            padding: 16px 0 2px;
            border-bottom: 2px solid #3749b4;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Loading / error */
        .loading-wrap {
            text-align: center;
            padding: 30px 0;
            color: #888;
        }
        .spinner {
            width: 32px; height: 32px;
            border: 4px solid #eee;
            border-top-color: #3749b4;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-msg {
            text-align: center;
            color: #c00;
            padding: 20px;
            font-weight: bold;
        }

        a { text-decoration: none; color: inherit; }
    </style>
</head>
<body>

<div class="scroll-notice">Scroll Down For More Matches!!</div>

<div id="matches-root">
    <div class="loading-wrap">
        <div class="spinner"></div>
        Loading matches...
    </div>
</div>

<script>
// ─── Badge/logo map for competitions ────────────────────────────────────────
const LEAGUE_LOGOS = {
    ucl:    "https://images.fotmob.com/image_resources/logo/leaguelogo/42.png",
    epl:    "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhWUOSoPAl0UAc96mClxUPxg6FUXdzQymSsViCLDmW8_eLR_jQu3RDvy-3Sqq8-91q5_uStEJxQ05O1S2sG0YzM2-4nsa98JFszi3c_HCFbok0Hq_F3yytUgiwA3b-boOOguPBu7tDp4zmM/s0/Premier-League_.webp",
    laliga: "https://images.fotmob.com/image_resources/logo/leaguelogo/dark/87.png",
    seriea: "https://images.fotmob.com/image_resources/logo/leaguelogo/dark/55.png",
    bundesliga: "https://images.fotmob.com/image_resources/logo/leaguelogo/dark/54.png",
    wc:     "https://images.fotmob.com/image_resources/logo/leaguelogo/10609.png",
    t20:    "https://images.fotmob.com/image_resources/logo/leaguelogo/10609.png",
    ipl:    "https://images.fotmob.com/image_resources/logo/leaguelogo/10609.png",
    odi:    "https://images.fotmob.com/image_resources/logo/leaguelogo/10609.png",
    test:   "https://images.fotmob.com/image_resources/logo/leaguelogo/10609.png",
    default:"https://images.fotmob.com/image_resources/logo/leaguelogo/10609.png"
};

function getLogo(badge) {
    return LEAGUE_LOGOS[badge] || LEAGUE_LOGOS.default;
}

// ─── Time helpers ─────────────────────────────────────────────────────────────
function getStatus(startStr, endStr) {
    const now  = new Date();
    const s    = new Date(startStr);
    const e    = new Date(endStr);
    if (now < s)  return { state: "upcoming", diff: s - now };
    if (now <= e) return { state: "live" };
    return { state: "ended" };
}

function formatCountdown(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return `${h}h ${m}m ${s}s`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
}

// ─── Build a single match row ─────────────────────────────────────────────────
function buildNotice(match, type) {
    const logo = getLogo(match.badge);
    const label = `${match.home_team} vs ${match.away_team}`;
    const format = match.format || match.competition_short || "";

    const a = document.createElement("a");
    a.href   = match.stream_url || "#";
    a.className = "notice";
    a.dataset.start = match.start;
    a.dataset.end   = match.end;

    a.innerHTML = `
        <div class="notice-inner">
            <img src="${logo}" alt="${match.competition}" onerror="this.src='${LEAGUE_LOGOS.default}'">
            <span class="match-label">${label}</span>
            ${format ? `<span class="format-badge">${format}</span>` : ""}
        </div>
        <div class="timer"></div>
    `;
    return a;
}

// ─── Build a league/competition section ──────────────────────────────────────
function buildSection(compName, badge, matches, type) {
    const logo = getLogo(badge);
    const frag = document.createDocumentFragment();

    const box = document.createElement("div");
    box.className = "box";
    box.innerHTML = `<img src="${logo}" alt="${compName}" onerror="this.src='${LEAGUE_LOGOS.default}'"><span>${compName.toUpperCase()} - SCHEDULE</span>`;
    frag.appendChild(box);

    matches.forEach(m => frag.appendChild(buildNotice(m, type)));
    return frag;
}

// ─── Group matches by competition ────────────────────────────────────────────
function groupBy(arr, key) {
    return arr.reduce((acc, item) => {
        const k = item[key];
        if (!acc[k]) acc[k] = { badge: item.badge, items: [] };
        acc[k].items.push(item);
        return acc;
    }, {});
}

// ─── Render everything ────────────────────────────────────────────────────────
function render(data) {
    const root = document.getElementById("matches-root");
    root.innerHTML = "";

    // ── Football ──
    if (data.football && data.football.length) {
        const heading = document.createElement("div");
        heading.className = "section-heading";
        heading.innerHTML = "⚽ Football Matches";
        root.appendChild(heading);

        const groups = groupBy(data.football, "competition");
        Object.entries(groups).forEach(([comp, { badge, items }]) => {
            root.appendChild(buildSection(comp, badge, items, "football"));
        });
    }

    // ── Cricket ──
    if (data.cricket && data.cricket.length) {
        const heading = document.createElement("div");
        heading.className = "section-heading";
        heading.innerHTML = "🏏 Cricket Matches";
        root.appendChild(heading);

        const groups = groupBy(data.cricket, "competition");
        Object.entries(groups).forEach(([comp, { badge, items }]) => {
            root.appendChild(buildSection(comp, badge, items, "cricket"));
        });
    }

    if (!data.football?.length && !data.cricket?.length) {
        root.innerHTML = "<div class='error-msg'>No matches scheduled at this time.</div>";
    }
}

// ─── Timer updater (runs every second) ───────────────────────────────────────
function updateAllTimers() {
    document.querySelectorAll(".notice[data-start]").forEach(el => {
        const timerEl = el.querySelector(".timer");
        if (!timerEl) return;
        const st = getStatus(el.dataset.start, el.dataset.end);
        if (st.state === "live") {
            timerEl.textContent = "Live Now";
            timerEl.className = "timer blinking";
        } else if (st.state === "upcoming") {
            timerEl.textContent = formatCountdown(st.diff);
            timerEl.className = "timer";
        } else {
            timerEl.textContent = "Match Ended";
            timerEl.className = "timer ended-text";
        }
    });
}

// ─── Fetch JSON and boot ──────────────────────────────────────────────────────
const JSON_URL = "https://sportssnap.github.io/fmatch/matches.json";

fetch(JSON_URL)
    .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
    })
    .then(data => {
        render(data);
        updateAllTimers();
        setInterval(updateAllTimers, 1000);
    })
    .catch(err => {
        document.getElementById("matches-root").innerHTML =
            `<div class='error-msg'>⚠️ Could not load matches.<br><small>${err.message}</small></div>`;
    });
</script>
</body>
</html>
